name: Render What If Animation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Episode slug to render'
        required: true
        default: 'sandglass'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        working-directory: studio
        run: npm install

      - name: Strip audio from timeline (silent render)
        working-directory: studio
        run: |
          python -c "import json,io; p='src/episodes/${{ github.event.inputs.slug || 'sandglass' }}/timeline.json'; d=json.load(io.open(p,encoding='utf-8')); d['audio']={}; io.open(p,'w',encoding='utf-8').write(json.dumps(d,indent=1,ensure_ascii=False))"

      - name: Render video
        working-directory: studio
        run: python ../scripts/master.py ${{ github.event.inputs.slug || 'sandglass' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: what-if-${{ github.event.inputs.slug || 'sandglass' }}
          path: studio/out/${{ github.event.inputs.slug || 'sandglass' }}/*-final.mp4
          retention-days: 30
