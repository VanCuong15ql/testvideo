name: Render What If Animation

concurrency:
  group: render-what-if-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Episode slug to render'
        required: true
        default: 'sandglass'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve slug
        id: slug
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            s="${{ github.event.inputs.slug }}"
          else
            base="${{ github.event.before }}"
            [ "$base" = "0000000000000000000000000000000000000000" ] && base="HEAD~1"
            # candidate slugs from this push's diff; drop any slug that is a
            # prefix of another (crush-p1 wins over crush)
            mapfile -t slugs < <(git diff --name-only "$base" HEAD | sed -n 's#studio/src/episodes/\([^/]*\)/.*#\1#p' | sort -u)
            s=""
            for cand in "${slugs[@]}"; do
              skip=0
              for other in "${slugs[@]}"; do
                if [ "$cand" != "$other" ] && [[ "$other" == "$cand"* ]]; then skip=1; fi
              done
              if [ $skip -eq 0 ]; then s="$cand"; break; fi
            done
            if [ -z "$s" ]; then
              # no episode changed: render the most recently touched one
              mapfile -t hist < <(git log --format= --name-only -30 | sed -n 's#studio/src/episodes/\([^/]*\)/.*#\1#p' | awk '!seen[$0]++')
              for cand in "${hist[@]}"; do
                skip=0
                for other in "${hist[@]}"; do
                  if [ "$cand" != "$other" ] && [[ "$other" == "$cand"* ]]; then skip=1; fi
                done
                if [ $skip -eq 0 ]; then s="$cand"; break; fi
              done
            fi
            s="${s:-sandglass}"
          fi
          echo "slug=$s" >> "$GITHUB_OUTPUT"
          echo "resolved slug: $s"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute frame chunks
        id: chunks
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          python - <<'EOF'
          import json, math, os
          slug = os.environ['SLUG']
          d = json.load(open(f'studio/src/episodes/{slug}/timeline.json', encoding='utf-8'))
          total = int(d['total'])
          # Per-job frame budget -> job count. Each job pays ~2 min of fixed
          # setup (checkout, npm install, bundle), so chunks under ~200 frames
          # are overhead-dominated; ~320 frames (~11 s of video) is the sweet
          # spot. MAX_JOBS stays under GitHub's practical matrix concurrency.
          TARGET_FRAMES = 320
          MAX_JOBS = 20
          MIN_CHUNK = 200
          n = max(1, min(MAX_JOBS, round(total / TARGET_FRAMES)))
          # never let a chunk shrink below MIN_CHUNK just to hit MAX_JOBS
          n = min(n, max(1, total // MIN_CHUNK))
          size = math.ceil(total / n)
          chunks = [{'i': i, 'start': i * size, 'end': min((i + 1) * size, total) - 1} for i in range(n)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('chunks=' + json.dumps(chunks) + '\n')
          print(f'total={total} jobs={len(chunks)} frames_per_job={size}')
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SLUG: ${{ needs.plan.outputs.slug }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        working-directory: studio
        run: npm install

      - name: Strip audio from timeline (silent render)
        working-directory: studio
        run: |
          python -c "import json,io,os; p='src/episodes/'+os.environ['SLUG']+'/timeline.json'; d=json.load(io.open(p,encoding='utf-8')); d['audio']={}; io.open(p,'w',encoding='utf-8').write(json.dumps(d,indent=1,ensure_ascii=False))"

      - name: Render chunk ${{ matrix.chunk.i }} (frames ${{ matrix.chunk.start }}-${{ matrix.chunk.end }})
        working-directory: studio
        run: |
          npx remotion render src/index.ts $(python -c "import json;print(json.load(open('src/episodes/$SLUG/episode.json',encoding='utf-8'))['id'])") \
            out/$SLUG/part-${{ matrix.chunk.i }}.mp4 \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} --log error

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.i }}
          path: studio/out/${{ needs.plan.outputs.slug }}/part-${{ matrix.chunk.i }}.mp4
          retention-days: 30

  join:
    needs: [render, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLUG: ${{ needs.plan.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: studio/out/${{ needs.plan.outputs.slug }}/
          merge-multiple: true

      - name: Concatenate chunks into raw video
        working-directory: studio/out/${{ needs.plan.outputs.slug }}
        run: |
          ls part-*.mp4 | sort -t- -k2 -n | while read f; do echo "file '$f'"; done > concat.txt
          cat concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -c copy ${SLUG}-raw.mp4

      - name: "Master (silent: copy-through, no loudnorm)"
        working-directory: studio
        run: python ../scripts/master.py $SLUG --skip-render

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: what-if-${{ needs.plan.outputs.slug }}
          path: studio/out/${{ needs.plan.outputs.slug }}/report.json
          retention-days: 30
      - name: Upload final mp4
        uses: actions/upload-artifact@v4
        with:
          name: what-if-${{ needs.plan.outputs.slug }}-video
          path: studio/out/${{ needs.plan.outputs.slug }}/${{ needs.plan.outputs.slug }}-final.mp4
          retention-days: 30
